name: Build llama.cpp (Windows)

on:
  workflow_dispatch: # 支持在 GitHub Actions 页面手动触发
  push:
    branches: [ master ] # 当 main 分支有推送时自动触发，可按需修改

jobs:
  build-windows-cpu:
    runs-on: windows-latest # GitHub 提供的 Windows Server 运行器
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1 # 配置 Visual Studio 的 C++ 编译环境
        with:
          arch: x64

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DLLAMA_CURL=OFF `
            -DLLAMA_BUILD_TESTS=OFF `         # 添加这一行
            -DLLAMA_BUILD_BENCHMARKS=OFF      # 可选，同时跳过基准测试

      - name: Build
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Package Artifacts
        run: |
          7z a -snl llama-bin-win-cpu-x64.zip .\build\bin\*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-bin-win-cpu-x64
          path: llama-bin-win-cpu-x64.zip
