name: Build llama-server CUDA only

on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: 'llama.cpp ref (branch / tag / commit)'
        required: false
        default: 'master'
      cuda_archs:
        description: 'CUDA arch 70'
        required: false
        default: '86'

jobs:
  build-server:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.llama_ref || github.ref }}
          fetch-depth: 1
          submodules: recursive

      - name: Install minimal build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ccache

      - name: Setup CUDA 12.1
        uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda
        with:
          cuda: '12.1.0'
          method: network
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","thrust"]'
          # CUDA 12.1 是 Jimver action 的默认版本，无需额外指定链接

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: llama-server-cuda12.1
          max-size: 1G

      - name: Configure (server-only, minimal)
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_USE_STATIC_CUDA_RUNTIME=ON \
            -DCMAKE_CUDA_ARCHITECTURES="${{ github.event.inputs.cuda_archs || '86' }}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_SERVER=ON

      - name: Build llama-server only
        run: |
          cmake --build build --config Release -j"$(nproc)" --target llama-server
          # 只构建 llama-server 这一个 target，跳过所有其他工具

      - name: Package
        run: |
          set -e
          STAGE=llama-server-cuda12.1-linux-x64
          mkdir -p "$STAGE"
          cp build/bin/llama-server "$STAGE/"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          ls -lh *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-cuda12.1
          path: llama-server-cuda12.1-linux-x64.tar.gz
          compression-level: 0
